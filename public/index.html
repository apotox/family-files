<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memories</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --muted:#666; --line:#ddd; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#181818; --fg:#eee; --muted:#aaa; --line:#333; --accent:#8ab4f8; } }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: var(--bg); color: var(--fg); }
  header { display: flex; justify-content: space-between; align-items: center; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1em; margin: 8px 0; }
  button { font: inherit; }
  .primary { padding: 12px; width: 100%; font-size: 1em; }
  .disk { color: var(--muted); font-size: .9em; margin: 0 0 12px; }
  .disk meter { display: block; width: 100%; height: 12px; margin-bottom: 4px; }
  .bar { display: flex; gap: 8px; }
  .pick { flex: 1; padding: 18px; text-align: center; border: 2px dashed var(--muted); border-radius: 10px; cursor: pointer; font-size: 1.1em; }
  .pick input { display: none; }
  #new-folder { padding: 0 14px; border-radius: 10px; }
  #crumbs { margin: 16px 0 0; overflow-wrap: anywhere; }
  #crumbs button { background: none; border: 0; padding: 4px 0; color: var(--accent); cursor: pointer; }
  #crumbs button:disabled { color: var(--fg); font-weight: 600; cursor: default; }
  #crumbs button:not(:last-child)::after { content: '›'; color: var(--muted); padding: 0 6px; }
  ul { list-style: none; padding: 0; margin-top: 8px; }
  li { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  li button { background: none; border: 0; cursor: pointer; }
  .open { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0; color: var(--accent); text-align: left; overflow-wrap: anywhere; }
  .open > span { display: flex; flex-direction: column; min-width: 0; }
  .thumb { flex: none; width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--line); color: var(--muted);
           display: flex; align-items: center; justify-content: center; font-size: .75em; font-weight: 600; }
  .thumb.folder { font-size: 1.8em; background: none; }
  .act { flex: none; padding: 8px; color: var(--muted); }
  small { color: var(--muted); }
  #preview { max-width: 95vw; max-height: 95vh; padding: 8px; border: 0; border-radius: 10px; background: var(--bg); color: var(--fg); }
  #preview::backdrop { background: rgb(0 0 0 / .85); }
  #preview img { display: block; max-width: 100%; max-height: calc(95vh - 72px); margin: 0 auto; object-fit: contain; }
  #preview form { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
  #preview-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview button { padding: 8px 14px; }
  #sending { width: min(360px, 90vw); border: 0; border-radius: 16px; padding: 16px; background: var(--bg); color: var(--fg); text-align: center; }
  #sending::backdrop { background: rgb(0 0 0 / .6); }
  #sending svg { display: block; width: 100%; }
  #sending p { margin: 12px 0 6px; overflow-wrap: anywhere; }
  #sending progress { width: 100%; }
  .trail { animation: march .8s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -16; } }
  @media (prefers-reduced-motion: reduce) { .trail { animation: none; } }
  #busy { position: fixed; left: 0; right: 0; bottom: 24px; width: fit-content; margin: 0 auto; display: flex; align-items: center; gap: 10px;
          max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px 18px; border-radius: 999px;
          background: var(--fg); color: var(--bg); box-shadow: 0 4px 16px rgb(0 0 0 / .25); overflow-wrap: anywhere; }
  #busy[hidden] { display: none; }
  .spin { flex: none; width: 14px; height: 14px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [inert] { opacity: .6; }
</style>
</head>
<body>
<header><h1>Memories</h1><button id="logout" type="button" hidden>Log out</button></header>

<form id="login-form" hidden>
  <label for="password">Family password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button class="primary" type="submit">Unlock</button>
</form>

<section id="app" hidden>
  <p class="disk"><meter id="disk-meter" min="0" max="1" low="0.75" high="0.9" optimum="0"></meter><span id="disk"></span></p>
  <div class="bar">
    <label class="pick">Tap to upload files<input type="file" multiple id="pick"></label>
    <button id="new-folder" type="button">New folder</button>
  </div>
  <nav id="crumbs" aria-label="Folder"></nav>
  <ul id="list"></ul>
</section>

<dialog id="preview" closedby="any">
  <img id="preview-img" alt="">
  <form method="dialog">
    <span id="preview-name"></span>
    <button id="preview-dl" type="button">Download</button>
    <button>Close</button>
  </form>
</dialog>

<!-- Upload animation: a file gets a lock (encrypted on this phone), then flies to the Pi. One 2.4 s SMIL loop. -->
<dialog id="sending">
  <svg id="send-art" viewBox="0 0 320 150" aria-hidden="true" stroke-linejoin="round">
    <defs>
      <symbol id="lk" viewBox="0 0 24 28">
        <path d="M6 13V8a6 6 0 0 1 12 0v5" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <rect x="2.5" y="12" width="19" height="15" rx="3.5" fill="currentColor"/>
      </symbol>
      <path id="star4" d="M0-8Q1.2-1.2 8 0Q1.2 1.2 0 8Q-1.2 1.2-8 0Q-1.2-1.2 0-8Z" fill="#FFD166"/>
    </defs>
    <rect width="320" height="150" rx="14" fill="#E8F4FF"/>
    <path d="M0 132Q80 124 160 131T320 128V150H0Z" fill="#BFE6B0"/>

    <!-- phone -->
    <rect x="38" y="44" width="44" height="78" rx="8" fill="#2B2D42"/>
    <rect x="43" y="52" width="34" height="62" rx="3" fill="#8ECAE6"/>

    <!-- the flight path -->
    <path class="trail" d="M60 80Q155-15 254 82" fill="none" stroke="#9B8CE0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>

    <!-- Raspberry Pi Zero W (same drawing as docs/hero.svg, half size), with a face on the chip -->
    <g transform="translate(212 84) scale(.5)">
      <rect width="170" height="80" rx="10" fill="#2E9E44" stroke="#2B2D42" stroke-width="5"/>
      <g fill="#FFF7E8" stroke="#E9C46A" stroke-width="3">
        <circle cx="12" cy="12" r="6"/><circle cx="158" cy="12" r="6"/><circle cx="12" cy="68" r="6"/><circle cx="158" cy="68" r="6"/>
      </g>
      <path d="M28 9H142M28 17H142" stroke="#E9C46A" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 6"/>
      <rect x="58" y="28" width="40" height="38" rx="4" fill="#C9CED6" stroke="#2B2D42" stroke-width="4"/>
      <circle cx="70" cy="44" r="3.5" fill="#2B2D42"/><circle cx="86" cy="44" r="3.5" fill="#2B2D42"/>
      <path d="M71 53q7 6 14 0" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="108" y="32" width="22" height="20" rx="2" fill="#C9CED6" stroke="#2B2D42" stroke-width="4"/>
      <circle cx="148" cy="42" r="6" fill="#80ED99" stroke="#2B2D42" stroke-width="3">
        <animate attributeName="fill" values="#80ED99;#80ED99;#fff;#80ED99;#80ED99" keyTimes="0;.8;.85;.95;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="254" y="140" font-size="11" font-weight="800" fill="#2B2D42" text-anchor="middle" font-family="system-ui, sans-serif">Pi Zero W</text>

    <!-- arrival sparkles -->
    <g opacity="0">
      <use href="#star4" x="236" y="66"/><use href="#star4" x="276" y="60"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.8;.86;.96;1" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- the file: appears on the phone, gets a lock and turns purple, then flies along the trail -->
    <g opacity="0">
      <path d="M-14-17h18l10 10v24h-28z" fill="#fff" stroke="#2B2D42" stroke-width="3">
        <animate attributeName="fill" values="#fff;#fff;#9B8CE0;#9B8CE0" keyTimes="0;.22;.3;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M4-17v10h10" fill="none" stroke="#2B2D42" stroke-width="3"/>
      <circle cx="-6" cy="-3" r="2" fill="#2B2D42"/><circle cx="3" cy="-3" r="2" fill="#2B2D42"/>
      <path d="M-5 3q3.5 3 7 0" fill="none" stroke="#2B2D42" stroke-width="2" stroke-linecap="round"/>
      <g opacity="0">
        <use href="#lk" x="4" y="4" width="14" height="16" color="#2B2D42"/>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.12;.24;1" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 -22;0 -22;0 0;0 0" keyTimes="0;.12;.26;1" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.8;.86;1" dur="2.4s" repeatCount="indefinite"/>
      <animateMotion path="M60 80Q155-15 254 82" keyPoints="0;0;1;1" keyTimes="0;.35;.8;1" calcMode="linear" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </svg>
  <p>Encrypting &amp; sending <b id="send-name"></b> <small id="send-count"></small></p>
  <progress id="send-bar" max="1" value="0"></progress>
</dialog>

<p id="msg" role="status"></p>
<div id="busy" role="status" hidden><span class="spin"></span><span id="busy-text"></span></div>
<script type="module" src="/app.mjs"></script>
</body>
</html>
